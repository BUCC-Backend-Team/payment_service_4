name: ci

on:
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    environment: testing

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"

      - name: Run Unit Tests
        run: go test ./... -cover
        env:
          PORT: ${{ vars.PORT || '4000' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
          PAYSTACK_BASE_URL: ${{ vars.PAYSTACK_BASE_URL || 'https://api.paystack.co' }}
          MERCHANT_API_KEY: ${{ secrets.MERCHANT_API_KEY }}
          CALLBACK_URL: ${{ vars.CALLBACK_URL || 'http://localhost:5000/callbacks' }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          PAYMENT_TIMEOUT_SECONDS: ${{ vars.PAYMENT_TIMEOUT_SECONDS || '1800' }}
          PAYMENT_EXPIRY_WORKER_INTERVAL_SECONDS: ${{ vars.PAYMENT_EXPIRY_WORKER_INTERVAL_SECONDS || '30' }}
          CALLBACK_WORKER_INTERVAL_SECONDS: ${{ vars.CALLBACK_WORKER_INTERVAL_SECONDS || '1' }}
          TEST_MODE: ${{ vars.TEST_MODE || 'true' }}

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Security Analysis
        run: gosec ./...

  style:
    name: Style
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.1"

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Linting
        run: staticcheck ./...

  gosec:
    name: gosec
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.1"

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Security Analysis
        run: gosec ./...
